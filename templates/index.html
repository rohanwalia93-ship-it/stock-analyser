<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Analyser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #94a3b8;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    .search-box input::placeholder { color: #64748b; }

    .search-box button {
      padding: 0.75rem 1.4rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f1117;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .search-box button:hover:not(:disabled) { opacity: 0.85; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      max-width: 600px;
      width: 100%;
      margin-bottom: 2rem;
    }

    .chip {
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .chip:hover { border-color: #38bdf8; color: #38bdf8; }

    #result-card {
      width: 100%;
      max-width: 600px;
      display: none;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.8rem;
      padding: 1.5rem;
    }

    .card-meta {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .analysis-text {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.97rem;
    }

    .error-text {
      color: #f87171;
    }

    .spinner {
      display: none;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }

    .spinner svg {
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>📈 Stock Analyser</h1>
    <p>AI-powered analysis for stocks, crypto, commodities &amp; indices</p>
  </header>

  <div class="search-box">
    <input id="query-input" type="text" placeholder="Tesla, Gold, Bitcoin, NVDA, S&amp;P 500…" autofocus />
    <button id="analyse-btn" onclick="analyse()">Analyse</button>
  </div>

  <div class="chips">
    <span class="chip" onclick="quickSearch('Tesla')">Tesla</span>
    <span class="chip" onclick="quickSearch('NVDA')">Nvidia</span>
    <span class="chip" onclick="quickSearch('Apple')">Apple</span>
    <span class="chip" onclick="quickSearch('Bitcoin')">Bitcoin</span>
    <span class="chip" onclick="quickSearch('Gold')">Gold</span>
    <span class="chip" onclick="quickSearch('S&P 500')">S&amp;P 500</span>
    <span class="chip" onclick="quickSearch('Ethereum')">Ethereum</span>
    <span class="chip" onclick="quickSearch('Microsoft')">Microsoft</span>
  </div>

  <div class="spinner" id="spinner">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="#334155" stroke-width="3"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p style="margin-top:0.75rem">Analysing — this may take 20–30 seconds…</p>
  </div>

  <div id="result-card">
    <div class="card">
      <div class="card-meta" id="result-meta"></div>
      <div class="analysis-text" id="result-body"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('query-input');
    const btn   = document.getElementById('analyse-btn');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') analyse(); });

    function quickSearch(term) {
      input.value = term;
      analyse();
    }

    async function analyse() {
      const query = input.value.trim();
      if (!query) return;

      setLoading(true);
      hideResult();

      try {
        const res = await fetch('/api/analyse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          showError(data.error || 'Something went wrong. Please try again.');
        } else {
          showResult(data);
        }
      } catch (err) {
        showError('Network error. Is the server running?');
      } finally {
        setLoading(false);
      }
    }

    function setLoading(on) {
      btn.disabled = on;
      btn.textContent = on ? 'Analysing…' : 'Analyse';
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
    }

    function hideResult() {
      document.getElementById('result-card').style.display = 'none';
    }

    function showResult(data) {
      const card = document.getElementById('result-card');
      document.getElementById('result-meta').textContent =
        `${data.ticker}  ·  ${data.asset_type}`;
      document.getElementById('result-body').className = 'analysis-text';
      document.getElementById('result-body').textContent = data.result;
      card.style.display = 'block';
    }

    function showError(msg) {
      const card = document.getElementById('result-card');
      document.getElementById('result-meta').textContent = 'Error';
      const body = document.getElementById('result-body');
      body.className = 'analysis-text error-text';
      body.textContent = msg;
      card.style.display = 'block';
    }
  </script>
</body>
</html>
